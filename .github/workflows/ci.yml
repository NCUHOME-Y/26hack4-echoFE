name: 构建并发布前端

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 检查构建配置
        run: |
          : "${VITE_API_BASE_URL:?请先配置仓库变量 VITE_API_BASE_URL}"

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build

      - name: 上传到 S3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          : "${AWS_ACCESS_KEY_ID:?请先配置仓库 Secret AWS_ACCESS_KEY_ID}"
          : "${AWS_SECRET_ACCESS_KEY:?请先配置仓库 Secret AWS_SECRET_ACCESS_KEY}"
          aws --endpoint-url https://s3.ncuos.com s3 sync dist/ s3://26-hack-4-fe/ --exclude index.html --only-show-errors
          aws --endpoint-url https://s3.ncuos.com s3 cp dist/index.html s3://26-hack-4-fe/index.html --content-type